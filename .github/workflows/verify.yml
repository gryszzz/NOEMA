name: NOEMA Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Build Python wheel
        run: pip wheel --no-deps . --wheel-dir /tmp/noema-wheels
      - name: Tests
        run: pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - name: Install site tools
        run: npm ci
      - name: Validate report contract and build Pages
        run: npm run site:test && npm run ops:test && npm run site:build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Production browser QA
        run: npm run site:qa && npm run ops:qa
