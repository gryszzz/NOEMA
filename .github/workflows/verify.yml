name: NOEMA Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Build Python wheel
        run: pip wheel --no-deps . --wheel-dir /tmp/noema-wheels
      - name: Tests
        run: pytest -q
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install site tools
        run: npm ci
      - name: Validate report contract and build Pages
        run: npm run site:test && npm run ops:test && npm run site:build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Production browser QA
        run: npm run site:qa && npm run ops:qa
