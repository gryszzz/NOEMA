name: NOEMA Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Build Python wheel
        run: pip wheel --no-deps . --wheel-dir /tmp/noema-wheels
      - name: Tests
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install site tools
        run: npm ci
      - name: Validate report contract and build Pages
        run: npm run site:test && npm run site:build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Production browser QA
        run: npm run site:qa && npm run ops:qa
