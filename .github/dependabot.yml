version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      pip-all:
        patterns: ["*"]
        update-types: [major, minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      npm-all:
        patterns: ["*"]
        update-types: [major, minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      uv-all:
        patterns: ["*"]
        update-types: [major, minor, patch]
