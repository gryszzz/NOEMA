# Earned-autonomy execution authority.
# Fractions are shares of current bankroll. They are configuration, not code.
# Live permission still requires gateway flags, and NOEMA_MASTER_HALT always wins.
# NOEMA_LIVE_REQUIRES_OWNER_REVIEW=1 (the default) keeps live locked after the
# level is earned. Set it to 0 only after the rung-8 owner review.

[shadow]
live = false

[paper]
live = false

[demo]
live = false

[micro]
live = true
per_trade_fraction = "0.03"
daily_notional_fraction = "0.10"

[proven]
live = true
per_trade_fraction = "0.03"
daily_notional_fraction = "0.30"

[self_funded]
live = true
per_trade_fraction = "0.05"
daily_notional_fraction = "0.50"

[expansion]
live = true
per_trade_fraction = "0.08"
daily_notional_fraction = "0.80"
