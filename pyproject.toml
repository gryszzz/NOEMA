[project]
name = "noema"
version = "0.1.0"
description = "Calibrated autonomous forecasting and prediction-market research engine."
requires-python = ">=3.12"
dependencies = [
  "httpx[socks]>=0.28,<1",
  "cryptography>=45,<46",
  "websockets>=15,<16",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "mcp>=1.26,<2",
  "solders>=0.29,<0.30",
  "eth-account>=0.13,<0.14",
  "embit>=0.8,<0.9",
  "polymarket-us>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
noema = "noema.cli:main"
noema-dashboard = "noema.dashboard_server:main"
noema-agent = "noema.agent_entry:main"
noema-meridian = "noema.meridian_bridge:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["openclaw"]

[tool.setuptools.package-data]
noema = ["static/*.html", "static/*.css", "static/*.mjs", "static/brand/*.png", "static/fonts/*"]

[tool.setuptools.packages.find]
include = ["noema", "noema.*"]
namespaces = false
