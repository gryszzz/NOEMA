<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function agents(){

// ---------- candles ----------
function fit(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const g=c.getContext("2d");g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}

 if(!cs.length){g.fillStyle="#7b6a86";g.font="18px VT";g.fillText(ch?(ch.status||"no candles"):"no held token yet",12,30);return;}
 const vh=vol?H*0.22:0,ph=H-vh-16,lo=Math.min(...cs.map(c=>c[3])),hi=Math.max(...cs.map(c=>c[2])),r=(hi-lo)||1,y=p=>8+(hi-p)/r*(ph-8),bw=(W-60)/cs.length,mv=Math.max(...cs.map(c=>c[5]||0))||1;
 g.strokeStyle="#1f0a22";g.fillStyle="#7b6a86";g.font="15px VT";for(let i=0;i<=4;i++){const p=lo+r*i/4;g.beginPath();g.moveTo(0,y(p));g.lineTo(W-58,y(p));g.stroke();g.fillText(p.toPrecision(4),W-56,y(p)+4);}
 cs.forEach((c,i)=>{const[t,o,h,l,cl,v]=c,x=i*bw+bw/2,up=cl>=o;g.strokeStyle=g.fillStyle=up?"#39ff88":"#ff3b3b";g.beginPath();g.moveTo(x,y(h));g.lineTo(x,y(l));g.stroke();g.fillRect(x-bw*.35,Math.min(y(o),y(cl)),bw*.7,Math.max(1,Math.abs(y(o)-y(cl))));
  if(vol){const vv=(v||0)/mv*(vh-4);g.globalAlpha=.5;g.fillRect(x-bw*.35,H-vv-2,bw*.7,vv);g.globalAlpha=1;}});
 (marks||[]).forEach(m=>{const i=cs.findIndex(c=>c[0]>=m.t);if(i<0)return;const x=i*bw+bw/2;g.fillStyle="#ff2bd6";g.font="14px VT";g.fillText("▼ "+m.l,x-6,y(cs[i][2])-6);});
 const last=cs[cs.length-1][4];g.strokeStyle="#ff2bd6";g.setLineDash([4,4]);g.beginPath();g.moveTo(0,y(last));g.lineTo(W-58,y(last));g.stroke();g.setLineDash([]);g.fillStyle="#ff2bd6";g.fillRect(W-58,y(last)-9,58,18);g.fillStyle="#000";g.fillText((+last).toPrecision(4),W-55,y(last)+4);}
function drawCharts(){const c=V4?.charts||[],tr=(S?.seats||[]).flatMap(s=>s.trades||[]);

 $("c1t").innerHTML=c[0]?`CHART · ${esc(c[0].symbol)} · ${c[0].timeframe||""} · geckoterminal <span>${(c[0].candles||[]).length} candles · ▼ = desk paper entry</span>`:"CHART · no held token";
 $("c2t").innerHTML=c[1]?`ANALYSIS · ${esc(c[1].symbol)} · ${c[1].timeframe||""} · price + volume <span>${esc(c[1].pool||"")}</span>`:"ANALYSIS · second held token: none";
 candles($("candles"),c[0],false,mk(c[0]));candles($("candles2"),c[1]||c[0],true,mk(c[1]||c[0]));}
// ---------- radar ----------
let sprites=[],sweep=0;
function syncSprites(){const f=(S?.feed||[]);sprites=f.slice(0,40).map((p,i)=>{const old=sprites.find(s=>s.mint===p.mint);return old?Object.assign(old,{p}):{mint:p.mint,p,a:Math.random()*6.28,d:.25+Math.random()*.7,v:(Math.random()-.5)*.004};});$("radt").textContent=`${sprites.length} real pools`;}
function radar(){const [g,W,H]=fit($("radar")),cx=W/2,cy=H/2,R=Math.min(W,H)/2-8;g.fillStyle="#000";g.fillRect(0,0,W,H);
 g.strokeStyle="#0f5a2e";for(let i=1;i<=4;i++){g.beginPath();g.arc(cx,cy,R*i/4,0,7);g.stroke();}g.beginPath();g.moveTo(cx-R,cy);g.lineTo(cx+R,cy);g.moveTo(cx,cy-R);g.lineTo(cx,cy+R);g.stroke();
 sweep+=.025;const gr=g.createConicGradient?g.createConicGradient(sweep,cx,cy):null;if(gr){gr.addColorStop(0,"rgba(57,255,136,.45)");gr.addColorStop(.12,"rgba(57,255,136,0)");gr.addColorStop(1,"rgba(57,255,136,0)");g.fillStyle=gr;g.beginPath();g.arc(cx,cy,R,0,7);g.fill();}
 sprites.forEach(s=>{s.a+=s.v;const x=cx+Math.cos(s.a)*s.d*R,y=cy+Math.sin(s.a)*s.d*R,st=s.p.stage,c=st==="desk"?"#ffe14a":st==="rejected"?"#ff3b3b":"#39ff88";
  const diff=((Math.atan2(y-cy,x-cx)-sweep)%6.283+6.283)%6.283,lit=diff>6.0||diff<.15;g.fillStyle=c;g.globalAlpha=lit?1:.55;g.fillRect(x-3,y-3,6,6);g.fillRect(x-5,y-1,2,2);g.fillRect(x+3,y-1,2,2);

// ---------- floor (isometric pedestals) ----------
function floor(t){const [g,W,H]=fit($("floor"));g.clearRect(0,0,W,H);const cols=4,rows=2,cw=W/cols,rh=H/rows;
 AG.forEach(([id,n,ic,c],i)=>{const x=cw*(i%cols)+cw/2,y=rh*Math.floor(i/cols)+rh*.68,s=Math.min(cw,rh)*.22;
  g.fillStyle="#12051a";g.beginPath();g.moveTo(x,y-s*.5);g.lineTo(x+s,y);g.lineTo(x,y+s*.5);g.lineTo(x-s,y);g.closePath();g.fill();g.strokeStyle=c;g.stroke();

  g.fillStyle="#000";g.font="13px PX";g.fillText(ic,x-7,by+5);

  g.fillStyle=c;g.font="11px PX";g.fillText(n,x-g.measureText(n).width/2,y+s*1.1+14);});}
// ---------- wires ----------
let packets=[];
function wires(t){const cv=$("wires"),[g,W,H]=fit(cv);g.clearRect(0,0,W,H);if(innerWidth<1100)return;
 const st=$("stage").getBoundingClientRect(),targets=[$("candles"),$("radar"),$("floor")].map(e=>e.getBoundingClientRect());
 AG.forEach(([id,,,c],i)=>{const a=$("ag-"+id).getBoundingClientRect(),tg=targets[i%3],sx=a.left+a.width/2,sy=a.bottom,ex=tg.left+tg.width*(.25+.5*((i*37)%10)/10),ey=tg.top+24,my=st.top+4+(i%4)*3;
  const pts=[[sx,sy],[sx,my],[ex,my],[ex,ey]];g.strokeStyle="rgba(255,43,214,.45)";g.lineWidth=1.5;g.beginPath();pts.forEach((p,j)=>j?g.lineTo(...p):g.moveTo(...p));g.stroke();
  const L=pts.slice(1).reduce((a,p,j)=>a+Math.hypot(p[0]-pts[j][0],p[1]-pts[j][1]),0),ph=((t/2200+i*.13)%1)*L;let acc=0;
  for(let j=1;j<pts.length;j++){const sl=Math.hypot(pts[j][0]-pts[j-1][0],pts[j][1]-pts[j-1][1]);if(acc+sl>=ph){const f=(ph-acc)/sl,x=pts[j-1][0]+(pts[j][0]-pts[j-1][0])*f,y=pts[j-1][1]+(pts[j][1]-pts[j-1][1])*f;g.shadowColor="#ff2bd6";g.shadowBlur=10;g.fillStyle="#ff7ae9";g.fillRect(x-3,y-3,6,6);g.shadowBlur=0;break;}acc+=sl;}});}
// ---------- balance ribbon ----------
let balShown=null,balAnim=0;
function balance(t){const [g,W,H]=fit($("bal"));g.clearRect(0,0,W,H);const s=(S?.equity_series||[]).map(e=>+e.equity_usd).filter(v=>!isNaN(v));if(s.length<2){g.fillStyle="#7b6a86";g.font="18px VT";g.fillText("waiting for equity snapshots…",12,40);return;}
 balAnim=Math.min(1,balAnim+.012);const n=Math.max(2,Math.floor(s.length*balAnim)),mn=Math.min(...s),mx=Math.max(...s),r=(mx-mn)||1,X=i=>10+i/(s.length-1)*(W-260),Y=v=>8+(mx-v)/r*(H-24);
 g.strokeStyle="#1f0a22";for(let i=0;i<4;i++){g.beginPath();g.moveTo(0,8+i*(H-24)/3);g.lineTo(W-250,8+i*(H-24)/3);g.stroke();}

 g.strokeStyle="#39ff88";g.lineWidth=2;g.shadowColor="#39ff88";g.shadowBlur=8;g.stroke();g.shadowBlur=0;g.lineTo(X(n-1),H);g.lineTo(X(0),H);g.fillStyle=gr;g.fill();g.fillStyle="#fff";g.fillRect(X(n-1)-3,Y(s[n-1])-3,6,6);
 g.fillStyle="#7b6a86";g.font="15px VT";g.fillText(usd(mx),W-246,14);g.fillText(usd(mn),W-246,H-14);}
function tickBal(){const s=S?.equity_series||[],tgt=s.length?+s[s.length-1].equity_usd:null;if(tgt==null)return;balShown=balShown==null?tgt*0.98:balShown+(tgt-balShown)*.12;if(Math.abs(tgt-balShown)<.005)balShown=tgt;$("balv").textContent=usd(balShown);}
// ---------- terminals ----------
let q=[],hist=0,lastCycle=null,seenT=new Set(),first=true;
function line(el,cls,txt,max){const d=document.createElement("div");d.className="ln "+cls;d.textContent=txt;el.appendChild(d);while(el.children.length>max)el.firstChild.remove();}
function feedLines(f,tag){const st=f.stage==="desk"?"BUY  ":f.stage==="rejected"?"REJ  ":"PASS ";return[
 [f.stage==="desk"?"y":f.stage==="rejected"?"r":"g",`[${tag}] ${st}${(f.symbol||"?").padEnd(10)} ${f.stage==="desk"?"judge p="+f.probability:(f.reason||f.stage||"")}`],
 ["",`   market_cap(fdv)=${k(f.fdv_usd).padStart(8)}  liquidity=${k(f.liquidity_usd).padStart(8)}  vol_1h=${k(f.volume_h1_usd).padStart(8)}  age=${f.pool_age_hours!=null?f.pool_age_hours.toFixed(1)+"h":"—"}`]];}
function pump(){const T=$("term");let item=q.shift();
 if(!item){const h=(S?.feed_history||[]).flatMap(c=>c.feed);if(h.length){const f=h[hist++%h.length];feedLines(f,"REPLAY").forEach(l=>line(T,l[0]==="g"?"d":l[0],l[1],40));line($("mini"),"","POOL: "+f.mint+"  "+(f.symbol||""),6);}}
 else{line(T,item[0],item[1],40);if(item[2])line($("mini"),"",item[2],6);}
 setTimeout(pump,q.length?140:420);}
function render(d){S=d;const fl=d.flags;$("flags").className="flags"+(fl.any_live?" on":"");$("flags").textContent=(fl.any_live?"⚠ LIVE FLAG ON":"ALL LIVE FLAGS OFF · PAPER ONLY")+" · gateway="+(fl.flags.NOEMA_EXECUTION_GATEWAY_ENABLED?"ON":"OFF");
 $("lvl").textContent="autonomy "+d.autonomy.level;const es=d.equity_series||[],day=es.length?Math.floor((Date.now()-Date.parse(es[0].ts))/864e5)+1:1,top=(d.seats.flatMap(s=>s.positions_detail||[])[0]||{}).symbol||"—";
 $("day").textContent="DAY "+day;$("ribt").firstChild.textContent=`BALANCE · DAY ${day} · ${top} `;const pnl=d.total_pnl_after_costs_usd;$("ribr").textContent=`${d.seats.reduce((a,s)=>a+s.wins,0)}W ${d.seats.reduce((a,s)=>a+s.losses,0)}L · P&L ${pnl>=0?"+":""}${usd(pnl)} after costs · ${es.length} snapshots`;
 const ch=d.chain;if(ch.ts&&ch.ts!==lastCycle){lastCycle=ch.ts;q.push(["y",`>>> desk_cycle ${new Date(ch.ts).toLocaleTimeString()} :: ${ch.crawler} pools scanned, ${ch.filters} passed filters, ${ch.desk} entries`]);(first?d.feed.slice(0,10):d.feed).forEach(f=>feedLines(f,"LIVE").forEach((l,i)=>q.push([...l,i?null:"POOL: "+f.mint+"  "+(f.symbol||"")])));}
 d.seats.forEach(s=>(s.trades||[]).forEach(t=>{if(!seenT.has(t.id)){seenT.add(t.id);if(!first)q.push(["y",`[FILL] ${s.name} paper ${t.side} ${k(t.qty)} ${t.symbol} @ ${(+t.fill_price).toPrecision(4)} = ${usd(t.notional_usd)}`]);}}));
 first=false;syncSprites();agents();}
async function poll(){try{const r=await fetch("/api/trading-room",{cache:"no-store"});if(r.ok)render(await r.json());}catch(e){}setTimeout(poll,2500);}
async function poll4(){try{const r=await fetch("/api/room-v4",{cache:"no-store"});if(r.ok){V4=await r.json();drawCharts();agents();(V4.chief||[]).slice(0,1).forEach(c=>{});}}catch(e){}setTimeout(poll4,30000);}
async function pollCC(){try{const r=await fetch("/api/command-center",{cache:"no-store"});if(r.ok){CC=await r.json();agents();}}catch(e){}setTimeout(pollCC,20000);}
function loop(t){radar();floor(t);wires(t);balance(t);tickBal();requestAnimationFrame(loop);}
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})+" ET"},1000);
addEventListener("resize",drawCharts);poll();poll4();pollCC();pump();requestAnimationFrame(loop);
</script></body></html>
